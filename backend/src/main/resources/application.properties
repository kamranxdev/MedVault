spring.application.name=medvault-backend
server.port=8080

# Database Configuration (Defaults to local in-memory H2 in PostgreSQL Mode; overridden by Docker Compose env vars for PostgreSQL DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:medvaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret & Expiration
app.jwt-secret=9a2f8c4e7b1a3d6f8e5c2b0a4f6e8d1c3b5a7f9e2d4c6b8a0f2e4d6c8b0a1f3
app.jwt-expiration-milliseconds=86400000
# Automatic SQL Database Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
