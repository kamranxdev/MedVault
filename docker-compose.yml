version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: medvault-oracle-db
    environment:
      - ORACLE_PASSWORD=Oracle123!
      - APP_USER=medvault
      - APP_USER_PASSWORD=MedVaultPass123!
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  medvault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medvault-backend-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      - SPRING_DATASOURCE_DRIVER=oracle.jdbc.OracleDriver
      - SPRING_DATASOURCE_USERNAME=SYSTEM
      - SPRING_DATASOURCE_PASSWORD=Oracle123!
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
    depends_on:
      oracle-db:
        condition: service_healthy

volumes:
  oracle-data:
