services:
  medvault-postgres-db:
    image: postgres:16-alpine
    container_name: medvault-postgres-db
    environment:
      - POSTGRES_DB=medvault
      - POSTGRES_USER=medvault
      - POSTGRES_PASSWORD=MedVaultPass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvault -d medvault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
