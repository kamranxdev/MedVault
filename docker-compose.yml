services:
  medvault-oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: medvault-oracle-db
    environment:
      - ORACLE_PASSWORD=Oracle123!
      - APP_USER=medvault
      - APP_USER_PASSWORD=MedVaultPass123!
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./backend/src/main/resources/schema.sql:/container-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/main/resources/seed.sql:/container-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  oracle-data:
