<div class="min-h-screen bg-[var(--bg-main)] text-slate-100 flex flex-col lg:flex-row relative overflow-x-hidden" *ngIf="authService.currentUser(); else unauth">
  
  <!-- Mobile Sidebar Backdrop Overlay -->
  <div 
    *ngIf="isMobile() && sidebarOpen()" 
    (click)="closeMobileSidebar()" 
    class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm transition-opacity duration-300">
  </div>

  <!-- Sidebar Navigation Drawer -->
  <aside 
    [class.translate-x-0]="sidebarOpen()"
    [class.-translate-x-full]="isMobile() && !sidebarOpen()"
    [class.w-72]="sidebarOpen()"
    [class.w-20]="!sidebarOpen() && !isMobile()"
    class="fixed lg:sticky top-0 left-0 z-50 h-screen shrink-0 glass-strong border-r border-slate-700/50 flex flex-col justify-between transition-all duration-300 shadow-2xl">
    
    <!-- Sidebar Header / Brand -->
    <div class="p-4 border-b border-slate-700/40 flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-purple-600 to-indigo-700 text-white font-black text-xl shadow-lg shadow-indigo-500/30">
          <i class="ri-heart-pulse-fill"></i>
        </div>
        <div *ngIf="sidebarOpen()" class="flex flex-col overflow-hidden animate-fade-in">
          <span class="font-extrabold text-lg text-white tracking-tight leading-tight">MedVault</span>
          <span class="text-[10px] font-semibold uppercase tracking-wider text-indigo-400">Enterprise EHR</span>
        </div>
      </div>

      <button 
        (click)="toggleSidebar()" 
        class="hidden lg:flex p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/60 transition">
        <i [class]="sidebarOpen() ? 'ri-menu-fold-line text-lg' : 'ri-menu-unfold-line text-lg'"></i>
      </button>
    </div>

    <!-- Sidebar Navigation Menu -->
    <div class="p-3 overflow-y-auto flex-1 space-y-6">
      <div *ngFor="let group of navGroups()" class="space-y-1">
        <span 
          *ngIf="sidebarOpen()" 
          [class]="group.colorClass || 'text-indigo-400'"
          class="text-[11px] font-bold uppercase tracking-wider px-3 py-1.5 block opacity-90 transition-opacity">
          {{ group.label }}
        </span>

        <nav class="space-y-1">
          <a 
            *ngFor="let item of group.items"
            [routerLink]="item.routerLink"
            routerLinkActive="bg-indigo-600/20 text-indigo-300 font-semibold border-l-4 border-indigo-500 shadow-md"
            (click)="closeMobileSidebar()"
            [title]="item.label"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition-all duration-200 group text-sm">
            <i [class]="item.icon + ' text-lg shrink-0 group-hover:scale-110 transition-transform'"></i>
            <span *ngIf="sidebarOpen()" class="truncate font-medium">{{ item.label }}</span>
            <span 
              *ngIf="item.badge && sidebarOpen()" 
              class="ml-auto px-2 py-0.5 text-xs font-bold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
              {{ item.badge }}
            </span>
          </a>
        </nav>
      </div>
    </div>

    <!-- Sidebar Footer / User Profile & Logout -->
    <div class="p-3 border-t border-slate-700/40 mt-auto bg-slate-900/60">
      <div class="flex items-center justify-between gap-2 p-2 rounded-xl glass-subtle">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <p-avatar [label]="userInitials()" shape="circle" class="size-9 text-xs font-bold shrink-0 bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-md" />
          <div *ngIf="sidebarOpen()" class="user-meta overflow-hidden animate-fade-in">
            <span class="text-xs font-semibold text-white truncate block leading-snug">{{ authService.currentUser()?.fullName }}</span>
            <span class="text-[10px] text-slate-400 truncate block">{{ primaryRole() }}</span>
          </div>
        </div>
        
        <button 
          (click)="logout()" 
          title="Logout" 
          class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition shrink-0">
          <i class="ri-logout-box-r-line text-lg"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col min-w-0 min-h-screen bg-[var(--bg-main)]">
    <!-- Top Header Bar -->
    <header class="sticky top-0 z-30 glass-subtle flex items-center justify-between px-4 lg:px-6 py-3 border-b border-slate-700/40 backdrop-blur-xl">
      <div class="header-left flex items-center gap-3 min-w-0">
        <button 
          (click)="toggleSidebar()" 
          class="lg:hidden p-2 rounded-xl bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/40 border border-indigo-500/30 transition flex items-center justify-center">
          <i class="ri-menu-line text-lg"></i>
        </button>

        <span class="font-extrabold text-white text-base tracking-tight hidden sm:inline-block">MedVault EHR</span>

        <!-- CLINICIAN PATIENT CONTEXT SELECTOR -->
        <div *ngIf="!isPatient() && patientContext.activePatient()" class="flex items-center gap-2 bg-slate-900/90 px-3 py-1.5 rounded-2xl border border-indigo-500/30 text-xs shadow-inner">
          <span class="text-slate-400 font-semibold hidden md:inline flex items-center gap-1">
            <i class="ri-user-shared-line text-indigo-400"></i> Active Patient:
          </span>
          <select 
            [ngModel]="patientContext.activePatient()?.id" 
            (ngModelChange)="onPatientContextChange($event)"
            class="bg-slate-950 text-indigo-300 font-bold border border-indigo-500/40 rounded-xl px-3 py-1 text-xs focus:ring-2 focus:ring-indigo-500 outline-none transition-all cursor-pointer">
            <option *ngFor="let p of patientContext.patientList()" [value]="p.id">
              {{ p.fullName }} (MRN: {{ p.patientCode }})
            </option>
          </select>
          <p-tag 
            *ngIf="patientContext.activePatient()?.medicalAlerts" 
            [value]="'Alert: ' + patientContext.activePatient()?.medicalAlerts" 
            severity="danger" 
            icon="ri-alert-fill"
            class="hidden lg:inline-flex">
          </p-tag>
        </div>

        <!-- PATIENT SELF-SERVICE BANNER -->
        <div *ngIf="isPatient() && patientContext.activePatient()" class="flex items-center gap-2 bg-teal-950/70 px-3 py-1.5 rounded-2xl border border-teal-500/40 text-xs shadow-inner">
          <span class="text-teal-300 font-bold hidden sm:inline">My Record:</span>
          <span class="text-white font-extrabold">{{ patientContext.activePatient()?.fullName }}</span>
          <p-tag [value]="'MRN: ' + patientContext.activePatient()?.patientCode" severity="info"></p-tag>
        </div>
      </div>

      <div class="header-right flex items-center gap-3 shrink-0">
        <p-tag [value]="primaryRole()" severity="warn" icon="ri-user-3-line" class="hidden sm:inline-flex"></p-tag>
        <span class="text-xs text-emerald-400 font-semibold flex items-center gap-1 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
          <span class="size-2 rounded-full bg-emerald-400 animate-ping"></span> 
          FHIR R4 Engine
        </span>
      </div>
    </header>

    <!-- Dynamic Route Outlet Content -->
    <div class="content-body animate-fade-in p-4 lg:p-6 flex-1 min-w-0">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<ng-template #unauth>
  <router-outlet></router-outlet>
</ng-template>
